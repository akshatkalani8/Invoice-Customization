services:
  - type: web
    name: barcode-builder-saas
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barcode-builder-saas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: barcode-builder-saas-db
    plan: free
